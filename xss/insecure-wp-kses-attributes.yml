rules:
  - id: insecure-wp-kses-attributes
    languages:
      - php
    severity: WARNING
    message: Insecure usage of wp_kses(). Certain attributes are allowed which could lead to XSS.
    patterns:
      - pattern-either:
          - pattern: >
              $ALLOWED_HTML = [..., "$HTML_TAG" => [..., '$ATTRIBUTE' => $VAL,
              ...], ...]; ... wp_kses(..., $ALLOWED_HTML, ...);
          - pattern: >
              wp_kses(..., [..., "$HTML_TAG" => [..., '$ATTRIBUTE' => $VAL,
              ...], ...] , ...);
      - metavariable-regex:
          metavariable: $ATTRIBUTE
          regex: (on.*|content|charset|http-equiv|from|to|xlink:href)
    metadata:
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - audit
      technology:
        - Wordpress Plugins
      references:
        - https://github.com/cure53/DOMPurify/blob/main/src/attrs.ts
        - https://portswigger.net/web-security/cross-site-scripting/cheat-sheet
        - https://wp-kama.com/function/wp_kses
      owasp:
        - A7:2017-Cross-Site Scripting (XSS)
      cwe:
        - "CWE-79: Improper Neutralization of Input ('Cross-site Scripting')"
      vulnerability_class:
        - Cross-Site Scripting
