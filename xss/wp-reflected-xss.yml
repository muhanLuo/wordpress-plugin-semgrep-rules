rules:
- id: wp-reflected-xss
  mode: taint
  message: Echoing of user input from the URL query may indicate a reflected XSS vulnerability.
  languages: [php]
  severity: HIGH
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
    # taint_assume_safe_functions: true # Can be enabled if you want to assume that function calls essentially sanitize the input (More info: https://semgrep.dev/docs/writing-rules/data-flow/taint-mode/advanced#minimize-false-positives)
    # interfile: true # Does cross-file analysis (More info: https://semgrep.dev/docs/semgrep-code/semgrep-pro-engine-intro)
  pattern-sources:
    - pattern: $_REQUEST
    - pattern: $_GET
  pattern-sinks:
    - pattern: echo (...);
    - pattern: print (...);
    - pattern: printf(...);
    - pattern: sprintf(...);
    - pattern: die(...);
    - pattern: wp_die(...);
  pattern-sanitizers:
    - patterns:
      - pattern: $SANITIZER(...)
      - metavariable-regex:
          metavariable: $SANITIZER
          regex: (htmlentities|htmlspecialchars|strip_tags|intval|absint|floatval|empty|isset|esc_.*|.*sanitize.*|.*escape.*|wp_kses.*)
  metadata:
    technology:
      - Wordpress Plugins
      - php
    cwe:
      - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
      - A07:2017 - Cross-Site Scripting (XSS)
      - A03:2021 - Injection
      - A05:2025 - Injection
    category: security
    references:
      - https://www.wordfence.com/blog/2024/09/how-to-find-xss-cross-site-scripting-vulnerabilities-in-wordpress-plugins-and-themes/
      - https://www.wordfence.com/learn/how-to-prevent-cross-site-scripting-attacks/
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
      - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM