# IMPORANT NOTE
# You must run "semgrep login" in order to run this rule
# 'join mode' is unavailable if you're not logged in
rules:
- id: wp-ajax-hook-missing-auth
  mode: join
  languages: [php]
  message: This callback function is callable via an AJAX hook, but did not have capability or nonce checks implemented
    , which might indicate a missing authorization vulnerability.
  severity: MEDIUM
  join:
    rules:
      - id: add-action-results
        languages: [php]
        patterns:
          - pattern-either:
              - pattern: add_action('$ACTION', [..., '$CALLBACK'], ...);
              - pattern: add_action('$ACTION', '$CALLBACK', ...);
          - metavariable-regex:
              metavariable: $ACTION
              regex: (admin_init|wp_ajax_.*|admin_post_.*|admin_action_.*|admin_menu|profile_update|personal_options_update)

      - id: no-auth-functions-results
        languages:
          - php
        patterns:
          - pattern: |
              function $CALLBACK(...) {
                ...
              }
          - pattern-not:
              patterns:
                - pattern: |
                    function $CALLBACK(...) {
                      ...
                      if (<... $WP_VERIFY(...) ...>)
                      {
                        ...
                      }
                      ...
                    }
                - metavariable-regex:
                    metavariable: $WP_VERIFY
                    regex: (current_user_can|wp_verify_nonce|check_ajax_referer|check_admin_referer)
          - pattern-not: function $CALLBACK(...) { ... check_ajax_referer(...); ... }
          - pattern-not: function $CALLBACK(...) { ... check_admin_referer(...); ... }

    on:
      - 'add-action-results.path == no-auth-functions-results.path' # Check that "add_action()" and the callback called by "add_action()" are in the same file.
      - 'add-action-results.$CALLBACK == no-auth-functions-results.$CALLBACK' # Only return functions which are called by "add_action()"

  metadata:
    technology:
      - Wordpress Plugins
      - php
    owasp:
      - A01:2021 - Broken Access Control
    cwe:
      - "CWE-285: Improper Authorization"
    vulnerability_class:
      - Improper Authorization
    category: security
    references:
      - https://www.wordfence.com/wp-content/uploads/2021/07/Common-WordPress-Vulnerabilities-and-Prevention-Through-Secure-Coding-Best-Practices.pdf (Pages 5-11)
    subcategory:
      - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM