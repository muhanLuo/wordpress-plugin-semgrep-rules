rules:
  - id: wp-missing-auth-rest-route-closures
    languages:
      - php
    severity: MEDIUM
    message: Usage of register_rest_route() where the callback called by 'permission_callback' does not perform a capability check with current_user_can(). Could indicate an authorization bypass. 
    patterns:
      - pattern: register_rest_route(..., ..., [..., 'permission_callback' =>
          function(...) { ... } , ...], ...)
      - pattern-not: >-
          register_rest_route(..., ..., [..., 'permission_callback' =>
          function(...) {
             ...
             current_user_can(...);
             ... 
             } , ...], ...)
      - pattern-not: >-
          register_rest_route(..., ..., [..., 'permission_callback' =>
          function(...) {
             ...
             if (<... current_user_can(...) ...>)
             {
              ...
             }
             ... 
             } , ...], ...)
    metadata:
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - audit
      technology:
        - Wordpress Plugins
        - php
      references:
        - (Page 8)
          https://www.wordfence.com/wp-content/uploads/2021/07/Common-WordPress-Vulnerabilities-and-Prevention-Through-Secure-Coding-Best-Practices.pdf
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-285: Improper Authorization"
      vulnerability_class:
        - Improper Authorization
