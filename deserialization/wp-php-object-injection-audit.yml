rules:
- id: wp-php-object-injection-audit
  mode: taint
  message: If the data used inside the patterns are directly passed to unserialize() or maybe_unserialize(), it could lead to PHP Object injection vulnerabilities. Do not use
      these function with user-supplied input, use JSON functions to serialize/deserialize instead.
  languages: [php]
  severity: WARNING
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
    # taint_assume_safe_functions: true # Can be enabled if you want to assume that function calls essentially sanitize the input (More info: https://semgrep.dev/docs/writing-rules/data-flow/taint-mode/advanced#minimize-false-positives)
    # interfile: true # Does cross-file analysis (More info: https://semgrep.dev/docs/semgrep-code/semgrep-pro-engine-intro)
  pattern-sources:
    - pattern: $_REQUEST
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: $_SERVER
    - pattern: $_SESSION
  pattern-sinks:
    - patterns:
      - pattern: unserialize(...)
      - pattern-not-inside: unserialize( ..., ['allowed_classes' => false] );
    - pattern: maybe_unserialize(...)
  pattern-sanitizers:
    - pattern: intval(...)
    - pattern: absint(...)
    - pattern: floatval(...)
    - pattern: empty(...)
    - pattern: isset(...)
  metadata:
    technology:
      - php
    cwe:
      - "CWE-502: Deserialization of Untrusted Data"
    owasp:
      - A03:2021 - Injection
      - A05:2025 - Injection
    category: security
    references:
      - https://patchstack.com/academy/wordpress/securing-code/php-object-injection/
      - https://github.com/wpscanteam/wpscan/wiki/WordPress-Plugin-Security-Testing-Cheat-Sheet#php-object-injection
      - https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection
    subcategory:
      - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM