rules:
- id: wp-php-object-injection-audit
  mode: taint
  message: If the data used inside the patterns are directly used without proper
      sanitization, then this could lead to PHP Object Injection. Do not use
      these function with user-supplied input, use JSON functions instead.
  languages: [php]
  severity: WARNING
  # Enable options below if you have Semgrep Pro to reduce false positives
  # options:
  # - interfile: true
  # - taint_assume_safe_numbers: true
  # - taint_assume_safe_booleans: true
  pattern-sources:
    - pattern: $_REQUEST
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: $_SERVER
    - pattern: $_SESSION
  pattern-sinks:
    - patterns:
      - pattern: unserialize(...)
      - pattern-not-inside: unserialize( ..., ['allowed_classes' => false] );
    - pattern: maybe_unserialize(...)
  pattern-sanitizers:
    - pattern: intval(...)
    - pattern: absint(...)
    - pattern: floatval(...)
    - pattern: empty(...)
    - pattern: isset(...)
  metadata:
    technology:
      - php
    cwe:
      - "CWE-502: Deserialization of Untrusted Data"
    owasp:
      - A03:2021 - Injection
      - A05:2025 - Injection
    category: security
    references:
      - https://patchstack.com/academy/wordpress/securing-code/php-object-injection/
      - https://github.com/wpscanteam/wpscan/wiki/WordPress-Plugin-Security-Testing-Cheat-Sheet#php-object-injection
      - https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
      - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH