rules:
- id: wp-open-redirect-audit
  mode: taint
  message: This function can be used to redirect to user supplied URLs. If user
      input is not sanitised or validated, this could lead to Open Redirect
      vulnerabilities. Use "wp_safe_redirect()" to prevent this kind of attack.
  languages: [php]
  severity: WARNING
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
    # taint_assume_safe_functions: true # Can be enabled if you want to assume that function calls essentially sanitize the input (More info: https://semgrep.dev/docs/writing-rules/data-flow/taint-mode/advanced#minimize-false-positives)
    # interfile: true # Does cross-file analysis (More info: https://semgrep.dev/docs/semgrep-code/semgrep-pro-engine-intro)
  pattern-sources:
    - pattern: $_REQUEST
    - pattern: $_GET
  pattern-sinks:
    - pattern: wp_redirect(...)
  metadata:
    technology:
      - php
    cwe:
      - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    category: security
    references:
      - https://github.com/wpscanteam/wpscan/wiki/WordPress-Plugin-Security-Testing-Cheat-Sheet#open-redirect
      - https://developer.wordpress.org/reference/functions/wp_redirect/
      - https://developer.wordpress.org/reference/functions/wp_safe_redirect/
    subcategory:
      - vuln
    likelihood: MEDIUM
    impact: LOW
    confidence: MEDIUM